<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar calibración | BioTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header class="encabezado-principal">
        <div class="header-top">
            <div>
                <h1>BioTrack</h1>
                <p>Sistema de Gestión de Equipos Médicos</p>
            </div>

            <div class="usuario-panel">
                <span>
                    {{ usuario_actual.nombre }}
                    <br>
                    <small>{{ usuario_actual.rol|capitalize }}</small>
                </span>

                <a
                    href="{{ url_for('cerrar_sesion') }}"
                    class="logout-button"
                >
                    Cerrar sesión
                </a>
            </div>
        </div>
    </header>

    <main class="container">

        <section class="formulario-card">

            <h2>Editar calibración</h2>

            <p>
                Equipo:
                <strong>
                    {{ calibracion.activo }} — {{ equipo.nombre }}
                </strong>
            </p>

            {% if mensaje %}
                <p class="mensaje">{{ mensaje }}</p>
            {% endif %}

            <form method="POST" class="formulario-registro">

                <label for="fecha">Fecha de calibración</label>
                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    value="{{ calibracion.fecha or '' }}"
                    required
                >

                <label for="resultado">Resultado</label>
                <select id="resultado" name="resultado" required>
                    <option value="">Seleccione una opción</option>

                    <option
                        value="Conforme"
                        {% if calibracion.resultado == "Conforme" %}
                            selected
                        {% endif %}
                    >
                        Conforme
                    </option>

                    <option
                        value="No conforme"
                        {% if calibracion.resultado == "No conforme" %}
                            selected
                        {% endif %}
                    >
                        No conforme
                    </option>

                    <option
                        value="Conforme con observaciones"
                        {% if calibracion.resultado == "Conforme con observaciones" %}
                            selected
                        {% endif %}
                    >
                        Conforme con observaciones
                    </option>
                </select>

                <label for="certificado">Número de certificado</label>
                <input
                    type="text"
                    id="certificado"
                    name="certificado"
                    value="{{ calibracion.certificado or '' }}"
                    required
                >

                <label for="patron_utilizado">Patrón utilizado</label>
                <textarea
                    id="patron_utilizado"
                    name="patron_utilizado"
                    rows="4"
                    required
                >{{ calibracion.patron_utilizado or '' }}</textarea>

                <label for="proxima_calibracion">
                    Próxima calibración
                </label>
                <input
                    type="date"
                    id="proxima_calibracion"
                    name="proxima_calibracion"
                    value="{{ calibracion.proxima_calibracion or '' }}"
                >

                <div class="formulario-acciones">
                    <button type="submit" class="manual-button">
                        Guardar cambios
                    </button>

                    <a
                        href="{{ url_for(
                            'ver_equipo',
                            activo=calibracion.activo
                        ) }}"
                        class="boton-secundario"
                    >
                        Cancelar
                    </a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
